version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: alumni_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MIS205spring2026}
      POSTGRES_DB: ${POSTGRES_DB:-alumni_card}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-alumni_card}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: alumni_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-MIS205spring2026}@db:5432/${POSTGRES_DB:-alumni_card}
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-secret-key-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json, urllib.request; data=json.load(urllib.request.urlopen('http://localhost:8000/health')); assert data['database'] == 'ok'\""]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx
      args:
        VITE_API_BASE_URL: ${ADMIN_API_BASE_URL:-/api/v1}
    container_name: alumni_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
