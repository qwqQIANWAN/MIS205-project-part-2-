<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中校友卡演示版</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">课堂展示 Demo</p>
        <h1>高中校友卡演示版</h1>
        <p class="subtitle">模拟微信登录、注册审核、返校预约的完整演示链路。</p>
      </div>
      <div class="hero-actions">
        <a class="ghost-btn" href="./admin.html" target="_blank" rel="noreferrer">打开审核后台</a>
        <button id="reset-demo" class="ghost-btn danger">重置演示数据</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel login-panel">
        <div class="panel-head">
          <h2>第一步：模拟微信登录</h2>
          <span id="login-status" class="status-chip muted">未登录</span>
        </div>
        <div class="form-grid">
          <label>
            <span>手机号</span>
            <input id="login-phone" type="text" placeholder="输入手机号，例如 13800000000" />
          </label>
          <label>
            <span>昵称</span>
            <input id="login-nickname" type="text" placeholder="输入演示昵称，例如 高三校友" />
          </label>
        </div>
        <div class="inline-actions">
          <button id="login-btn" class="primary-btn">模拟微信登录</button>
          <button id="logout-btn" class="ghost-btn">退出登录</button>
        </div>
        <p class="hint">说明：课堂展示中用手机号 + 昵称模拟微信授权登录，登录后可继续注册与预约。</p>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>第二步：注册并提交审核</h2>
          <span id="verify-status" class="status-chip muted">待提交</span>
        </div>
        <div class="form-grid three">
          <label><span>姓名</span><input id="real-name" type="text" placeholder="请输入真实姓名" /></label>
          <label><span>手机号</span><input id="register-phone" type="text" placeholder="请输入手机号" /></label>
          <label><span>高中班级</span><input id="class-name" type="text" placeholder="如：高三(2)班" /></label>
          <label><span>毕业届次</span><input id="graduation-year" type="text" placeholder="如：2024" /></label>
          <label><span>当前就读高校</span><input id="current-university" type="text" placeholder="如：华南师范大学" /></label>
          <label><span>当前院系</span><input id="current-college" type="text" placeholder="如：教育信息技术学院" /></label>
          <label><span>当前专业</span><input id="current-major" type="text" placeholder="如：教育技术学" /></label>
          <label class="full"><span>证件材料说明</span><input id="certificate-note" type="text" placeholder="如：已上传学生证照片（演示用文本代替）" /></label>
        </div>
        <div class="inline-actions">
          <button id="submit-registration" class="primary-btn">提交注册审核</button>
          <button id="fill-demo-profile" class="ghost-btn">填入演示示例</button>
        </div>
        <div id="profile-summary" class="summary-card empty">登录后，这里会显示当前注册与审核状态。</div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>第三步：返校预约</h2>
          <span id="appointment-status" class="status-chip muted">未提交</span>
        </div>
        <div class="form-grid three">
          <label><span>参访老师</span><input id="visit-teacher" type="text" placeholder="如：陈老师" /></label>
          <label><span>入校日期</span><input id="visit-date" type="date" /></label>
          <label><span>同行人数</span><input id="companion-count" type="number" min="0" value="0" /></label>
          <label class="full"><span>来校事由</span><textarea id="visit-purpose" rows="3" placeholder="如：返校看望老师并分享大学学习经历"></textarea></label>
        </div>
        <div class="inline-actions">
          <button id="submit-appointment" class="primary-btn">提交入校预约</button>
          <button id="fill-demo-appointment" class="ghost-btn">填入演示预约</button>
        </div>
        <div id="appointment-list" class="list-card empty">审核通过后即可提交预约，预约记录会显示在这里。</div>
      </section>
    </main>
  </div>

  <script src="./shared.js"></script>
  <script src="./app.js"></script>
</body>
</html>
