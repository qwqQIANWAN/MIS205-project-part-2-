<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中校友卡审核后台 Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="admin-body">
  <div class="shell">
    <header class="hero compact">
      <div>
        <p class="eyebrow">课堂展示 Demo</p>
        <h1>审核后台</h1>
        <p class="subtitle">可查看注册申请、进行审核，并查看返校预约记录。</p>
      </div>
      <div class="hero-actions">
        <a class="ghost-btn" href="./index.html" target="_blank" rel="noreferrer">打开用户端</a>
        <button id="refresh-admin" class="ghost-btn">刷新数据</button>
      </div>
    </header>

    <main class="layout admin-layout">
      <section class="panel">
        <div class="panel-head">
          <h2>待审核注册</h2>
          <span id="pending-count" class="status-chip accent">0 条</span>
        </div>
        <div id="registration-table" class="table-card empty">当前暂无待审核注册。</div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>预约记录</h2>
          <span id="appointment-count" class="status-chip accent">0 条</span>
        </div>
        <div id="appointment-table" class="table-card empty">当前暂无入校预约。</div>
      </section>
    </main>
  </div>

  <script src="./shared.js"></script>
  <script src="./admin.js"></script>
</body>
</html>
